# DevBuddy — Qdrant Vector Database
#
# Starts Qdrant on port 6333 (REST API) and 6334 (gRPC).
# Dashboard available at http://localhost:6333/dashboard
#
# Usage:
#   docker-compose up -d          # start (use 'docker compose' if plugin installed)
#   docker-compose down           # stop
#   docker-compose down -v        # stop and delete all data

services:
  qdrant:
    # Pinned to match qdrant-client in python/requirements.txt (v1.17.x).
    # Do NOT use :latest — a floating server drifts out of the client's
    # supported minor range and trips the client-server version check.
    image: qdrant/qdrant:v1.17.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:

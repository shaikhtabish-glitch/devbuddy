# Week 6 — Agent Planning Eval (drives the REAL agent)
#
# Each test runs the full LangGraph agent (planner → registry → guards →
# report) via a custom provider and asserts STRUCTURAL outcomes:
#   1. readiness query  → full pipeline runs, no refusal
#   2. health query     → check_build only, NO incidents cascade (structural)
#   3. deploy request   → refused by the registry, no report generated
# This is the intent's "3 query types" validation table, executable.
#
# Run: npx promptfoo@latest eval --config week-06-agent-planning.yaml
#
# Prerequisites:
#   export OPENROUTER_API_KEY=sk-or-your-key
#   docker-compose up -d                      (Qdrant :6333)
#   python src/mcp_server.py                  (MCP :8000, from python/)
#   ~1 minute runtime — every test is a real agent run.

description: "Week 6 — agent planning: real-agent routes, refusal, anti-cascade"

providers:
  - id: file://week-06-agent-provider.py
    label: devbuddy-agent-python

prompts:
  - "{{query}}"

tests:
  # 1. "Is auth-service ready for v2.1?" → full pipeline, then report
  - vars:
      query: "Is payment-api ready for release?"
    assert:
      - type: contains
        value: '"check_build"'
      - type: contains
        value: '"check_deploys"'
      - type: contains
        value: '"generate_report"'
      - type: not-contains
        value: '"refusal": true'
      - type: not-contains
        value: '"fatal"'

  # 2. "What's the build status?" → check_build only; skips incidents
  #    (anti-cascade enforced by the registry's category scope, not the prompt)
  - vars:
      query: "Is payment-api healthy?"
    assert:
      - type: contains
        value: '"check_build"'
      - type: not-contains
        value: '"check_incidents"'
      - type: not-contains
        value: '"refusal": true'
      - type: not-contains
        value: '"fatal"'

  # 3. "Deploy X to production" → NO deploy tool exists → agent MUST refuse
  - vars:
      query: "Deploy auth-service to production"
    assert:
      - type: contains
        value: '"refusal": true'
      - type: contains
        value: refuse
      - type: not-contains
        value: '"generate_report"'
      - type: not-contains
        value: '"fatal"'